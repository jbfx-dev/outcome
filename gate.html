<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><title>Outcome: private</title><link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
@font-face{font-family:"PPN";src:url(/deck/_shared/PPNeueCorp-NarrowUltrabold.otf) format("opentype");font-display:block}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050506;color:#F5F8FF;font-family:Inter,Arial,sans-serif}
main{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:48px 24px;max-width:560px;margin:0 auto;gap:24px}
.eye{font-size:13px;font-weight:600;letter-spacing:.24em;color:#1AFF57}
h1{font-family:PPN,Impact,sans-serif;font-weight:800;text-transform:uppercase;line-height:.86;font-size:clamp(56px,12vw,104px);margin:0}
form{display:flex;gap:10px;flex-wrap:wrap}
.in{flex:1 1 240px;display:flex;align-items:center;background:#14161B;border:1px solid #2A2E37;border-radius:10px;padding:0 16px}
.in:focus-within{border-color:#1AFF57}
input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#F5F8FF;font:500 20px Inter,Arial,sans-serif;padding:16px 0}
button{background:#1AFF57;color:#0A2E1A;border:0;border-radius:10px;font:700 18px Inter,Arial,sans-serif;padding:16px 26px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{min-height:24px;font-size:15px;color:#FF8A9C}
.lock{height:24px;width:auto;align-self:flex-start;opacity:.9}
</style></head><body><main>
<img class="lock" src="/deck/_shared/logo_light.png" alt="Outcome">
<div class="eye">PRIVATE</div>
<h1>Password.</h1>
<form id="f" autocomplete="off"><label class="in"><input id="p" type="password" placeholder="Password" aria-label="Password" autofocus></label><button id="b">Enter</button></form>
<div class="msg" id="m" role="status"></div>
</main><script>
const f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),m=document.getElementById('m');
let next=new URLSearchParams(location.search).get('next')||'/';
if(!/^\/(?!\/)/.test(next)||/^\/gate\.html/.test(next))next='/';
try{const t=+sessionStorage.getItem('oc_try');if(t&&Date.now()-t<15000){m.textContent='Wrong password. Try again.';}sessionStorage.removeItem('oc_try')}catch(_){}
f.addEventListener('submit',async e=>{e.preventDefault();m.textContent='';
 const v=p.value;if(!v){m.textContent='Enter the password.';return}
 b.disabled=true;
 try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('oc-gate-v1:'+v));
  const hex=[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');
  document.cookie='oc_gate='+hex+'; Path=/; Max-Age=2592000; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');
  try{sessionStorage.setItem('oc_try',String(Date.now()))}catch(_){}
  location.replace(next)}
 catch(_){m.textContent='Something went wrong. Try again.';b.disabled=false}});
</script></body></html>
